name: update repository
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 17 30 * 5" # runs weekly on Saturday at 02:30 (JST)

permissions: read-all

jobs:
  update-repo:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'misumisumi'
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            accept-flake-config = true
            connect-timeout = 15
            cores = 4
            download-buffer-size = 524288000
            http-connections = 25
            max-jobs = 2
            stalled-download-timeout = 15

      - name: Setup git account
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      # Update flake.lock first: package dependency hashes (cargoDeps, npmDeps,
      # mvnHash, ...) depend on the nixpkgs revision, so package updates must
      # run against the updated flake.lock.
      # No PR is created here: changes are only committed locally and the PR is
      # created once at the end, so a failed run never leaves a partial PR.
      - name: Update flake.lock
        run: |
          nix flake update
          if ! git diff --quiet -- flake.lock; then
            git add flake.lock
            git commit -m "chore(flake.lock): auto update flake.lock"
          fi

      - name: Update package version
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          nix run .#update-pkgs -- --commit

      # nix-update skips dependency hashes when the version is unchanged.
      # Refresh them after the flake.lock update (e.g. mvnHash with a newer
      # Maven, cargoDeps/npmDeps with a newer toolchain).
      - name: Refresh dependency hashes
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          nix run .#update-pkgs-hashes -- --commit

      - name: Update README
        run: |
          scripts/update-readme.sh
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update README"

      # Create the PR only after every update step has succeeded.
      # If there is no diff against the base branch, this step exits silently
      # (no PR is created), matching the previous behavior.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: update_flake_lock_action
          delete-branch: true
          commit-message: "chore: auto update flake.lock and packages"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "chore: auto update flake.lock and packages"
          body: |
            Automated update of flake.lock, package versions and README.
          labels: |
            dependencies
            automated
